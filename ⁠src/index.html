<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darktalk - Rastgele Sesli Dil Pratiği</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        neonpurple: '#8b5cf6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-white min-h-screen flex flex-col justify-between">

    <!-- Üst Menü -->
    <header class="p-4 flex justify-between items-center bg-cardbg border-b border-gray-800 shadow-lg">
        <h1 class="text-xl font-bold tracking-wider text-neonpurple">Darktalk</h1>
        <div class="flex items-center space-x-2">
            <span class="inline-block w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
            <span id="status-text" class="text-xs text-gray-300">Bağlantı Bekleniyor...</span>
        </div>
    </header>

    <!-- Orta Alan (Arama ve Eşleşme Ekranı) -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 text-center my-auto">
        <div id="welcome-box" class="space-y-4 w-full max-w-sm">
            <h2 class="text-2xl font-extrabold">Dünyayla Sesli Pratik Yap</h2>
            <p class="text-xs text-gray-400 px-2">Anonim olarak bağlan, yabancı dilde konuşma becerilerini geliştir.</p>
            
            <!-- Dil Seçimi ve Buton -->
            <div class="flex flex-col space-y-3 pt-2">
                <select id="language-select" class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-neonpurple">
                    <option value="en">İngilizce (English)</option>
                    <option value="tr">Türkçe (Turkish)</option>
                    <option value="es">İspanyolca (Spanish)</option>
                    <option value="fr">Fransızca (French)</option>
                </select>
                <button onclick="startMatching()" class="bg-neonpurple hover:bg-purple-700 text-white font-bold px-6 py-3 rounded-xl transition duration-300 shadow-lg shadow-purple-500/30 text-sm">
                    Sohbet Başlat
                </button>
            </div>
        </div>

        <!-- Eşleşme Durumu (Gizli Başlangıçta) -->
        <div id="matching-box" class="hidden space-y-4">
            <div class="relative w-24 h-24 mx-auto flex items-center justify-center">
                <div class="absolute inset-0 border-4 border-neonpurple rounded-full animate-ping opacity-75"></div>
                <div class="w-16 h-16 bg-neonpurple rounded-full flex items-center justify-center text-2xl font-bold shadow-xl">
                    🎙️
                </div>
            </div>
            <p class="text-lg font-medium text-gray-200">Konuşacak biri aranıyor...</p>
            <button onclick="cancelMatching()" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-xl text-xs font-semibold transition">
                İptal Et
            </button>
        </div>
    </main>

    <!-- Alt Bilgi -->
    <footer class="p-3 text-center text-[10px] text-gray-500 border-t border-gray-800">
        &copy; 2026 Darktalk. Güvenli Sesli Sohbet.
    </footer>

    <!-- JavaScript Mantığı -->
    <script>
        function startMatching() {
            document.getElementById('welcome-box').classList.add('hidden');
            document.getElementById('matching-box').classList.remove('hidden');
            document.getElementById('status-text').innerText = 'Eşleşme aranıyor...';
            
            setTimeout(() => {
                document.getElementById('status-text').innerText = 'Bağlandı 🟢';
            }, 3000);
        }

        function cancelMatching() {
            document.getElementById('matching-box').classList.add('hidden');
            document.getElementById('welcome-box').classList.remove('hidden');
            document.getElementById('status-text').innerText = 'Bağlantı Bekleniyor...';
        }
    </script>
</body>
</html>
